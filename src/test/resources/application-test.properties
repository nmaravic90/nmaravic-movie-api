# Testcontainers ce pregaziti datasource, ovo su fallback vrijednosti
spring.datasource.url=jdbc:postgresql://localhost:5432/movie_test
spring.datasource.username=test
spring.datasource.password=test

# Hibernate ce kreirati shemu automatski u testovima
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# context path
server.servlet.context-path=/

# pagination
movie.page.size=10
movie.top.rated.limit=5
movie.image.upload.dir=/tmp/movie-test-uploads
movie.image.server.base.url=http://localhost:8080/images

# Disable Keycloak JWT validation u testovima
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9999/realms/test
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost/dummy-jwk-uri


spring.test.context.cache.maxSize=1